[project]
name = "sense-ml"
version = "1.0.0"
description = "Training, interpretation, and inference pipeline for the released peptide classifiers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
repository = "https://github.com/TingtingLiGroup/SENSE"
dependencies = [
  "afrc==0.3.7",
  "biopython==1.85",
  "finches @ git+https://github.com/idptools/finches.git@76779734408567043ad98c456c049010edb3ca9b",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pandas==2.3.0",
  "pyyaml==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.16.0",
  "shap==0.48.0",
  "sparrow @ git+https://github.com/idptools/sparrow.git@70bd11b6bdddf82376199299b8b3022430ece394",
  "tabpfn==2.0.9",
  "tabpfn-extensions @ git+https://github.com/PriorLabs/tabpfn-extensions.git@ec002940b6fb0769b407c09c2ac2c22bc732e506",
  "torch==2.7.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/microdroplet_ml"]
