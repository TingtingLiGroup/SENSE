[project]
name = "microdroplet-ml-open"
version = "0.1.0"
description = "Script-first training and inference pipeline for the Microdroplet model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "biopython>=1.85",
  "cloudpickle==3.1.1",
  "colour==0.1.5",
  "future==1.0.0",
  "galois==0.4.6",
  "hyperopt==0.2.7",
  "kditransform==0.2.0",
  "llvmlite==0.44.0",
  "numba==0.61.2",
  "scikit-learn>=1.6.1",
  "numpy>=1.14.0,<2.0",
  "py4j==0.10.9.9",
  "shap==0.48.0",
  "shapiq==1.3.0",
  "slicer==0.0.8",
  "sparse-transform==0.2.1",
  "tabpfn-extensions @ git+https://github.com/PriorLabs/tabpfn-extensions.git@ec002940b6fb0769b407c09c2ac2c22bc732e506",
  "finches @ git+https://github.com/idptools/finches.git#egg=main",
  "sparrow @ git+https://github.com/idptools/sparrow.git#egg=main",
  "tabpfn",
  "ipykernel>=6.29.5",
  "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/microdroplet_ml"]
