sequence_column: Seq
name_column: name
min_length: 14
cv_folds: 3
cv_random_state: 13
performance_group: micro_physiochemical

feature_sets:
  micro_physiochemical:
    - norm_rg
    - norm_re
    - epsilon_mf
    - epsilon_cf
    - asphericity
    - fraction_aliphatic
    - hydrophobicity
    - FCR
  micro_physical:
    - norm_rg
    - norm_re
    - epsilon_mf
    - epsilon_cf
    - asphericity
  sol_physiochemical:
    - fraction_aliphatic
    - hydrophobicity
    - pI
    - fraction_aromatic
    - rg
  sol_chemical:
    - fraction_aliphatic
    - hydrophobicity
    - pI
    - fraction_aromatic

outputs:
  features_table: features_generated.csv
  model_performance: model_performance_on_microcompartment_3fold.csv

  models_alldata: models_alldata_20250425.pkl
  data_micro_prediction_physiochemical: data_micro_prediction_physiochemical_20250425.csv

  models_physical_alldata: models_physical_alldata_20250425.pkl
  data_micro_prediction_physical: data_micro_prediction_physical_20250425.csv

  models_sol_alldata: models_sol_alldata_20250425.pkl
  data_sol_prediction_physiochemical: data_sol_prediction_physiochemical_20250425.csv

  models_sol_chemical_alldata: models_sol_chemical_alldata_20250425.pkl
  data_sol_prediction_chemical: data_sol_prediction_chemical_20250425.csv

prediction_groups:
  - name: micro_physiochemical
    task: micro
    feature_set: micro_physiochemical
    model_output: models_alldata
    train_prediction_output: data_micro_prediction_physiochemical
    model_file: models_alldata_20250425.pkl
    prefix: micro_physchem
  - name: sol_physiochemical
    task: sol
    feature_set: sol_physiochemical
    model_output: models_sol_alldata
    train_prediction_output: data_sol_prediction_physiochemical
    model_file: models_sol_alldata_20250425.pkl
    prefix: sol_physchem
  # Optional legacy groups are kept in the repository and exposed through
  # configs/full.yaml, but are not enabled by default.
