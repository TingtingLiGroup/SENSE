sequence_column: sequence
name_column: sequence_id
min_length: 14
cv_folds: 3
cv_random_state: 13

labels:
  associative_framework: associative_framework_label
  solubility: solubility_label

feature_sets:
  associative_framework:
    - norm_rg
    - norm_re
    - epsilon_mf
    - epsilon_cf
    - asphericity
    - fraction_aliphatic
    - hydrophobicity
    - FCR
  solubility:
    - fraction_aliphatic
    - hydrophobicity
    - pI
    - fraction_aromatic
    - rg

outputs:
  features_table: peptide_features.csv
  associative_framework_cv: associative_framework_cv_metrics.csv
  associative_framework_models: associative_framework_model_bundle.pkl
  associative_framework_predictions: associative_framework_training_predictions.csv
  solubility_cv: solubility_cv_metrics.csv
  solubility_models: solubility_model_bundle.pkl
  solubility_predictions: solubility_training_predictions.csv

prediction_groups:
  - name: associative_framework
    task: associative_framework
    feature_set: associative_framework
    cv_output: associative_framework_cv
    model_output: associative_framework_models
    train_prediction_output: associative_framework_predictions
    model_file: associative_framework_model_bundle.pkl
    prefix: associative_framework
  - name: solubility
    task: solubility
    feature_set: solubility
    cv_output: solubility_cv
    model_output: solubility_models
    train_prediction_output: solubility_predictions
    model_file: solubility_model_bundle.pkl
    prefix: solubility

reference_checks:
  - associative_framework_cv
  - associative_framework_predictions
  - solubility_cv
  - solubility_predictions
