name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pandas==2.3.0 PyYAML==6.0.2 pytest==8.4.1
      - name: Verify release contract
        run: python -m pytest -q
      - name: Verify released-file checksums
        run: sha256sum --check SHA256SUMS
